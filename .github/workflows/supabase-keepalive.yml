name: Supabase Keepalive

# 2026-08-22 개편.
#
# 왜 고쳤나 — 예전 워크플로는 3일마다 feedback_posts 를 "읽기"만 했다.
# 그런데도 8/13 성공 → 8/16 실패(exit 6, DNS 해석 불가) 사이에 프로젝트가 휴면에 들어갔다.
# 즉 읽기 요청만으로는 Supabase 가 활동으로 치지 않는 것으로 보인다.
# 게다가 실패가 8/16·8/19 두 번 조용히 지나가 6일 뒤에야 발견됐다.
#
# 바꾼 것
#   ① 3일 → 매일
#   ② 읽기 → 쓰기 우선 (읽기는 폴백)
#   ③ 실패하면 이슈를 만들어 알림이 가게 한다 (같은 이슈가 열려 있으면 중복 생성 안 함)
#
# ⚠️ keepalive 테이블이 아직 없어도 동작한다 — 쓰기가 실패하면 읽기로 넘어간다.
#    테이블을 만들면 그때부터 쓰기가 잡힌다. 만드는 SQL 은 아래 참고.
#
#      create table if not exists public.keepalive (
#        id int primary key,
#        pinged_at timestamptz not null default now()
#      );
#      insert into public.keepalive (id) values (1) on conflict do nothing;
#      grant select, insert, update on public.keepalive to anon;
#
# ⚠️ 키는 저장소 시크릿 SUPABASE_ANON_KEY 를 먼저 쓰고, 없으면 아래 공개 키를 쓴다.
#    (publishable 키라 노출되어도 무방하지만, 시크릿으로 두면 교체가 쉽다)

on:
  schedule:
    - cron: '17 3 * * *'   # 매일 UTC 03:17
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write            # 실패 시 이슈 생성에 필요 — 기본 토큰은 읽기 전용이다

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase 핑 (쓰기 우선, 읽기 폴백)
        run: |
          set -u
          URL="https://pxvzogbmjyotttrucaxz.supabase.co"
          KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          if [ -z "$KEY" ]; then
            KEY="sb_publishable_T14w4z9ElufgUTfg2XOw7A_NyU5a1yN"
            echo "시크릿 미설정 — 워크플로에 적힌 공개 키를 사용합니다."
          fi

          # ① 쓰기 — 확실한 DB 활동. 테이블이 없으면 실패하고 ②로 넘어간다.
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if curl -sf -o /dev/null -X POST "$URL/rest/v1/keepalive" \
               -H "apikey: $KEY" \
               -H "Content-Type: application/json" \
               -H "Prefer: resolution=merge-duplicates" \
               -d "{\"id\":1,\"pinged_at\":\"$NOW\"}" ; then
            echo "✅ 쓰기 성공 (keepalive.pinged_at = $NOW)"
            exit 0
          fi
          echo "쓰기 실패 — keepalive 테이블이 없거나 권한이 없습니다. 읽기로 넘어갑니다."

          # ② 읽기 폴백 — 테이블 하나만 응답해도 통과. 한 테이블의 권한 문제로
          #    전체가 실패하던 예전 구조(feedback_posts 단독 의존)를 피한다.
          for t in card_visits reaction_scores prime_scores feedback_posts; do
            if curl -sf -o /dev/null "$URL/rest/v1/$t?select=id&limit=1" -H "apikey: $KEY" ; then
              echo "✅ 읽기 성공 ($t)"
              echo "::warning::쓰기 핑이 실패했습니다. keepalive 테이블을 만들면 휴면 방지가 더 확실해집니다."
              exit 0
            fi
            echo "  - $t 실패"
          done

          echo "❌ 쓰기·읽기 모두 실패 — 프로젝트가 휴면됐거나 접근이 막혔습니다."
          exit 1

      - name: 실패하면 이슈 생성
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '⚠️ Supabase Keepalive 실패';
            // 같은 제목의 열린 이슈가 있으면 새로 만들지 않는다 (매일 도니까 쌓인다)
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'keepalive'
            });
            if (open.data.some(i => i.title === title)) {
              core.info('이미 열린 이슈가 있어 생성하지 않습니다.');
              return;
            }
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, labels: ['keepalive'],
              body: [
                'Supabase 핑이 **쓰기·읽기 모두 실패**했습니다.',
                '',
                '프로젝트가 휴면(pause)됐을 가능성이 높습니다.',
                '[Supabase 대시보드](https://supabase.com/dashboard)에서 상태를 확인하고 Restore 하세요.',
                '',
                '휴면이면 랭킹(반응속도·소수 게임)·제보 게시판·방문 통계가 전부 멈춥니다.',
                '',
                `실행 로그: ${url}`,
                '',
                '_복구한 뒤 이 이슈를 닫으면, 다음 실패 때 다시 생성됩니다._'
              ].join('\n')
            });
