<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- 공개 URL 이지만 검색 색인은 받지 않는다 (저작권 노출 축소 — CLAUDE.md 결정) -->
<meta name="robots" content="noindex, noarchive">
<title>몬스터 도감 퀴즈</title>
<!--
  ⚠️⚠️⚠️ 데이터 임베드 규칙 — 절대 바꾸지 마라 ⚠️⚠️⚠️
  도감 데이터(dex.json)는 반드시 <template id="dex"> 안에 raw JSON 으로 넣는다.
  build.js 108행의 정규식  /<script(\s[^>]*)?>(?!<)([\s\S]*?)<\/script>/gi  는
  type 속성을 보지 않기 때문에 < script type="application/json" > 안의 JSON 도
  "자바스크립트 소스"로 간주해 난독화한다. 배열의 배열은 유효한 JS 표현식이라
  난독화가 조용히 성공하고 경고도 뜨지 않으며, dist 에서만 JSON.parse 가 죽는다.
  <template> 은 위 정규식에 매치되지 않아 원문이 그대로 살아남는다(실측 dist ×1.06).
  삽입 시  <  →  &lt;  ,  &  →  &amp;  , U+2028 / U+2029 를 이스케이프할 것.
  읽기:  JSON.parse(document.getElementById('dex').content.textContent)
  "데이터를 script 태그로 옮기는 게 깔끔하다"는 리팩터링은 앱을 조용히 깨뜨린다.

  ⚠️ 이 주석(과 데이터 위 주석)에서 여는 스크립트 태그를 "< script ... >" 처럼 띄어 쓴 것은
  오타가 아니다. 위 정규식은 주석 안인지 밖인지를 구분하지 않으므로, 붙여 쓰면 이 주석의
  여는 태그가 파일 맨 끝 < /script > 까지를 한 덩어리로 매치한다. 그 덩어리는 JS 로 파싱되지
  않아 build.js 가 [WARN] 후 원본을 그대로 두고, 결과적으로 진짜 스크립트 블록은 난독화를
  한 번도 거치지 않은 채 배포된다(실측: dist 가 src ×1.000, 소스 전문이 평문 노출).
  붙여 쓰지 마라.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ── 형제 앱(mathdrill_v1)과 같은 토큰 구조. 색만 이 앱의 하늘색 계열로 ── */
  --bg:#eef6ff;
  --bg2:#dbeaff;
  --card:#ffffff;
  --ink:#22374f;
  --muted:#7b90a8;
  --line:#dceaf8;
  --primary:#4a90e2;
  --primary-d:#2f6fc0;
  --ball:#f2564d;
  --ball-d:#d63c34;
  --gold:#f5c23e;
  --gold-d:#dda50f;
  --green:#4cb782;
  --green-d:#359a68;
  --shadow:0 10px 28px rgba(40,90,150,.16);
  --shadow-sm:0 4px 14px rgba(40,90,150,.13);
  --f-disp:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  --imgh:min(38vh,320px);          /* 키패드 접힘 (이미지 상한) */
}
body.padopen{--imgh:min(30vh,250px)}  /* 키패드 펼침 (이미지 상한) */

html,body{height:100%;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);
  font-family:var(--f-body);-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input{font:inherit;color:inherit;border:none;background:none}

.app{width:min(560px,100%);margin:0 auto;height:100vh;height:100dvh;
  padding:6px 12px calc(6px + env(safe-area-inset-bottom));display:flex;flex-direction:column}

/* ── 화면 전환: mathdrill 과 동일한 .screen / .screen.active / go(name) ── */
.screen{display:none}
.screen.active{display:block;flex:1 1 auto;min-height:0;overflow-y:auto;
  -webkit-overflow-scrolling:touch;animation:fade .28s ease}
#scrHome.screen.active{display:flex;flex-direction:column}
/* 세로 flex 안에서 자식이 기본 shrink:1 로 눌리면 details.fold 가 overflow:hidden 으로
   내용을 잘라내고, 화면 자체는 scrollHeight===clientHeight 라 스크롤도 생기지 않는다.
   → 폰에서 '글자 입력 방법' 과 '특별한 범위' 에 손이 닿지 않는다. 줄이지 말고 넘치게 둔다. */
#scrHome.screen.active>*{flex:0 0 auto}
#scrQuiz.screen.active{display:flex;flex-direction:column;gap:5px;overflow:hidden}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.h2{font-family:var(--f-disp);font-size:18px;color:var(--ink);margin:16px 2px 10px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.home{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:14px;background:#fff;
  text-decoration:none;color:var(--muted);font-size:14px;font-weight:700;box-shadow:var(--shadow-sm)}
.title{font-family:var(--f-disp);font-size:20px;color:var(--primary-d)}
.rec-chip{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:16px;background:#fff;
  box-shadow:var(--shadow-sm);font-size:13px;font-weight:700;color:var(--gold-d)}

/* ══════════════ 홈 ══════════════ */
.hero{background:linear-gradient(135deg,#e6f2ff,#cfe4ff);border-radius:24px;padding:18px 18px 14px;
  text-align:center;box-shadow:var(--shadow);margin-bottom:14px}
.hero .mascot{width:56px;height:56px;margin:0 auto;border-radius:50%;
  background:linear-gradient(var(--ball) 0 43%,#2b3a49 43% 57%,#fff 57% 100%);
  box-shadow:inset 0 0 0 3px #2b3a49,0 5px 14px rgba(40,90,150,.22);position:relative}
.hero .mascot::after{content:'';position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;
  border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px #2b3a49}
.hero h1{font-family:var(--f-disp);font-size:26px;color:var(--primary-d);margin-top:2px}
.hero p{color:#5c7898;font-size:13px;font-weight:500;margin-top:2px}

.btn-start{display:block;width:100%;min-height:112px;border-radius:28px;
  background:linear-gradient(135deg,#ff7a6b,var(--ball-d));color:#fff;box-shadow:0 12px 26px rgba(214,60,52,.34);
  font-family:var(--f-disp);font-size:34px;letter-spacing:.02em;transition:transform .12s}
.btn-start:active{transform:scale(.97)}
.btn-start .sub{display:block;font-family:var(--f-body);font-size:13px;font-weight:500;opacity:.92;margin-top:4px}

/* 접히는 범위 고르기 */
.fold{background:#fff;border-radius:20px;box-shadow:var(--shadow-sm);margin-top:14px;overflow:hidden}
.fold>summary{list-style:none;cursor:pointer;padding:16px 16px;display:flex;align-items:center;
  justify-content:space-between;font-family:var(--f-disp);font-size:17px;color:var(--ink);min-height:56px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary .caret{color:var(--muted);font-size:14px;transition:transform .2s}
.fold[open]>summary .caret{transform:rotate(180deg)}
.fold-body{padding:0 16px 16px;border-top:2px solid var(--line)}
.sub-h{font-size:13px;font-weight:700;color:var(--muted);margin:14px 2px 8px}

.gen-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gen-chip{min-height:48px;border-radius:14px;background:#f2f7fd;box-shadow:inset 0 0 0 2px var(--line);
  font-family:var(--f-disp);font-size:15px;color:var(--muted);transition:transform .1s}
.gen-chip:active{transform:scale(.95)}
.gen-chip.on{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(74,144,226,.35)}
.row-2{display:flex;gap:8px;margin-top:10px;align-items:center}
.mini-btn{flex:0 0 auto;padding:10px 14px;min-height:44px;border-radius:13px;background:#fff;
  box-shadow:inset 0 0 0 2px var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.count-badge{margin-left:auto;padding:9px 14px;border-radius:14px;background:#fff6dc;
  font-family:var(--f-disp);font-size:15px;color:var(--gold-d);white-space:nowrap}

.opt-list{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;min-height:56px;padding:12px 14px;border-radius:16px;
  background:#f2f7fd;box-shadow:inset 0 0 0 2px var(--line);cursor:pointer}
.opt input{position:absolute;opacity:0;width:0;height:0}
.opt .dot{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:inset 0 0 0 3px var(--line);margin-top:2px;transition:box-shadow .15s}
.opt .tx{flex:1}
.opt .nm{font-family:var(--f-disp);font-size:16px}
.opt .ds{font-size:12px;color:var(--muted);font-weight:500;margin-top:2px;line-height:1.45}
.opt.on{background:#e7f1ff;box-shadow:inset 0 0 0 3px var(--primary)}
.opt.on .dot{box-shadow:inset 0 0 0 7px var(--primary)}
.special-row{display:flex;gap:8px;margin-top:10px}
.special-btn{flex:1;min-height:56px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);
  font-family:var(--f-disp);font-size:14px;color:var(--ink);line-height:1.35}
.special-btn .cnt{display:block;font-family:var(--f-body);font-size:11px;font-weight:600;color:var(--muted);margin-top:3px}
.special-btn:disabled{opacity:.45;cursor:default}

.record-line{margin:auto 2px 6px;padding-top:14px;text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
.credit{align-self:stretch;width:100%;max-width:100%;box-sizing:border-box;margin:10px 0 0;padding:0 8px;text-align:center;font-size:10.5px;line-height:1.5;color:#9aa8bd;word-break:keep-all}
.record-line b{font-family:var(--f-disp);font-size:16px;color:var(--primary-d);font-weight:400}

/* ══════════════ 문제 ══════════════ */
.qhead{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:38px}
.icon-btn{width:38px;height:38px;border-radius:13px;background:#fff;box-shadow:var(--shadow-sm);
  font-size:18px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.balls{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:3px}
.ball{width:16px;height:16px;border-radius:50%;background:#c9dbec;box-shadow:inset 0 0 0 2px #aec5da;
  flex:0 0 auto;transition:transform .2s}
.ball.got{background:linear-gradient(var(--ball) 0 43%,#2b3a49 43% 57%,#fff 57% 100%);box-shadow:inset 0 0 0 2px #2b3a49}
.ball.miss{background:linear-gradient(#b3c5d6 0 43%,#7d93a8 43% 57%,#eaf1f7 57% 100%);box-shadow:inset 0 0 0 2px #7d93a8}
.ball.cur{transform:scale(1.35);box-shadow:inset 0 0 0 2px var(--primary-d),0 0 0 3px rgba(74,144,226,.28)}
.qcount{flex:0 0 auto;font-family:var(--f-disp);font-size:15px;color:var(--muted);min-width:42px;text-align:right}

/* stage 는 도감 카드(translateY 105%)를 잘라내야 하므로 overflow:hidden 필수 */
.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden}

/* 세로 공간이 모자라면 .scans 가 먼저(shrink 100) 줄고, 그래도 모자랄 때만
   이미지가 줄어든다(shrink 1). 정보줄이 한 줄 늘어나도 답 표시줄이 밀려나지 않는다. */
.imgcard{flex:0 1 auto;height:var(--imgh);min-height:140px;position:relative;border-radius:22px;
  background:radial-gradient(ellipse at 50% 40%,#ffffff,#eaf3fd 78%);box-shadow:var(--shadow);
  overflow:hidden;display:flex;align-items:center;justify-content:center}
.dexpic{max-width:92%;max-height:92%;object-fit:contain;-webkit-touch-callout:none;user-select:none;
  -webkit-user-select:none;transition:transform .3s}
.imgcard .overlay{position:absolute;left:10px;bottom:10px;display:flex;gap:5px;flex-wrap:wrap;max-width:calc(100% - 20px)}
.imgcard .gen-badge{position:absolute;right:10px;top:10px;padding:5px 11px;border-radius:14px;
  background:rgba(34,55,79,.82);color:#fff;font-family:var(--f-disp);font-size:13px}

.tchip{padding:5px 12px;border-radius:14px;font-family:var(--f-disp);font-size:14px;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.22);box-shadow:0 3px 8px rgba(0,0,0,.15)}
/* 포켓몬 타입 18색 (관용색) */
.t0{background:#a8a77a}                       /* 노말 */
.t1{background:#ee8130}                       /* 불꽃 */
.t2{background:#6390f0}                       /* 물 */
.t3{background:#f7d02c;color:#4a3c00;text-shadow:none} /* 전기 */
.t4{background:#7ac74c}                       /* 풀 */
.t5{background:#96d9d6;color:#154f4d;text-shadow:none} /* 얼음 */
.t6{background:#c22e28}                       /* 격투 */
.t7{background:#a33ea1}                       /* 독 */
.t8{background:#e2bf65;color:#4b3a06;text-shadow:none} /* 땅 */
.t9{background:#a98ff3}                       /* 비행 */
.t10{background:#f95587}                      /* 에스퍼 */
.t11{background:#a6b91a}                      /* 벌레 */
.t12{background:#b6a136}                      /* 바위 */
.t13{background:#735797}                      /* 고스트 */
.t14{background:#6f35fc}                      /* 드래곤 */
.t15{background:#705746}                      /* 악 */
.t16{background:#b7b7ce;color:#33334a;text-shadow:none} /* 강철 */
.t17{background:#d685ad}                      /* 페어리 */

.facts{flex:0 0 auto;text-align:center;line-height:1.34}
.facts .f1{font-size:13px;font-weight:700;color:var(--ink)}
.facts .f2{font-size:12.5px;font-weight:600;color:var(--muted)}
.facts .sep{color:#b3c9de}

.slots{flex:0 0 auto;display:flex;justify-content:center;gap:10px}
.slot{width:30px;height:30px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 3px var(--line);
  display:flex;align-items:center;justify-content:center;font-family:var(--f-disp);font-size:18px;color:var(--muted)}
.slot.filled{background:#e7f1ff;box-shadow:inset 0 0 0 3px var(--primary);color:var(--primary-d)}

.scans{flex:0 100 auto;min-height:0;max-height:124px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;
  scrollbar-width:none;-webkit-mask-image:linear-gradient(#000 calc(100% - 8px),transparent);
  mask-image:linear-gradient(#000 calc(100% - 8px),transparent)}
.scans::-webkit-scrollbar{display:none}
.scanrow{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:5px 10px;
  box-shadow:var(--shadow-sm);animation:slidein .3s ease}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.scanrow .tag{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--gold-d);background:#fff6dc;
  padding:3px 8px;border-radius:9px}
.scanrow .val{font-family:var(--f-disp);font-size:17px;letter-spacing:.14em;color:var(--ink)}
/* ★ 스캔은 눌릴 때마다 아래로 쌓이고, 쌓인 줄은 전부 보여야 한다(명세).
   .scans 는 shrink 100 이라 자리를 안 잡아 주면 제일 먼저 잘린다 —
   줄 수만큼 min-height 를 주어(JS 가 n1/n2 를 붙인다) 두 줄을 지켜 낸다.
   그만큼은 그림에서 나온다(아래 max-height:700px 블록의 imgcard min-height). */
.scans.n1{min-height:32px}
.scans.n2{min-height:68px}
.msg{flex:0 0 auto;text-align:center;font-family:var(--f-disp);font-size:14px;line-height:20px;min-height:20px;color:var(--primary-d)}
/* 비어 있는 줄은 높이를 갖지 않는다 — 좁은 화면에서 그림·스캔이 그만큼 살아난다 */
.msg:empty{min-height:0}
.msg.warn{color:var(--gold-d)}
.msg.ok{color:var(--green-d)}

/* 답 표시줄 */
.answerbar{flex:0 0 auto;display:flex;gap:6px;align-items:stretch;height:56px}
.display{flex:1 1 auto;min-width:0;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 3px var(--line);
  display:flex;align-items:center;padding:0 12px;overflow:hidden}
.display.focus{box-shadow:inset 0 0 0 3px var(--primary)}
.display input{width:100%;font-family:var(--f-disp);font-size:24px;color:var(--ink);outline:none}
.display input::placeholder{color:#c3d3e3}
.answerbar button{flex:0 0 auto;border-radius:16px;font-family:var(--f-disp);display:flex;
  align-items:center;justify-content:center;transition:transform .1s}
.answerbar button:active{transform:scale(.95)}
.btn-ok{width:64px;background:var(--green);color:#fff;font-size:17px;box-shadow:0 5px 14px rgba(53,154,104,.32)}
.btn-scan{width:56px;background:var(--gold);color:#5a4300;box-shadow:0 5px 14px rgba(221,165,15,.3);
  flex-direction:column;line-height:1.02}
.btn-scan .ic{font-size:19px}
.btn-scan .lb{font-family:var(--f-body);font-size:10.5px;font-weight:700}
.btn-fold{flex-direction:column;line-height:1.02}
.btn-fold .lb{font-family:var(--f-body);font-size:9.5px;font-weight:700}
.btn-fold{width:42px;background:#fff;color:var(--muted);font-size:16px;box-shadow:var(--shadow-sm)}

/* 자모 키패드 7×5 */
.jamopad{flex:0 0 auto;display:none;flex-direction:column;gap:4px;padding:6px 5px;
  border-radius:18px;background:rgba(255,255,255,.55);box-shadow:var(--shadow-sm)}
body.padopen .jamopad{display:flex}
.jamopad .krow{display:flex;gap:4px}
.jamopad .krow.r2{padding:0 5.2%}          /* 두벌식 둘째 줄은 반 칸 들여쓴다 — 실제 자판과 같은 모양 */
.jamopad .k-wide{flex:1.5 1 0}             /* ⇧ · ⌫ */
.jamopad .k-go{flex:3 1 0}                 /* 확인 */
.jamopad button{flex:1 1 0;min-width:0;height:38px;border-radius:11px;background:#fff;box-shadow:0 2px 5px rgba(40,90,150,.16);
  font-family:var(--f-disp);font-size:19px;color:var(--ink);transition:transform .08s,background .12s}
.jamopad button:active{transform:scale(.9);background:#e7f1ff}
.jamopad .k-fn{background:#e9f1f9;color:var(--muted);font-size:16px}
.jamopad .k-fn.on{background:var(--primary);color:#fff}

/* 타일 입력(‘아직 어렵다’ 모드) — 키패드와 같은 자리를 쓴다 */
.tilepad{flex:0 0 auto;display:none;gap:8px;padding:8px 4px}
body.tilemode .tilepad{display:flex}
body.tilemode .jamopad,body.tilemode .btn-fold{display:none}
.tile{flex:1;height:66px;border-radius:18px;background:#fff;box-shadow:var(--shadow);
  font-family:var(--f-disp);font-size:32px;color:var(--ink);transition:transform .1s}
.tile:active{transform:scale(.94)}
.tile.used{opacity:.35}

/* 정답 순간 — 입력 통로를 감춰 그림과 도감 카드에 공간을 내준다.
   통합 담당: 정답 처리 시 document.body.classList.add('revealed'), 다음 문제에서 remove. */
body.revealed .jamopad,body.revealed .tilepad,body.revealed .answerbar{display:none}

/* 정답 연출 */
/* 백스페이스 연타처럼 빠르게 두 번 누르면 사파리가 더블탭 확대로 해석해 화면이 튄다.
   touch-action:manipulation 은 더블탭 확대만 끄고 스크롤·핀치 확대는 그대로 남긴다. */
.app,button,a,label,input,.tile{touch-action:manipulation}
.imgcard::after{content:'';position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.imgcard.correct::after{animation:flash .14s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
/* 처음에는 실루엣만 보여준다(난이도). 스캔 1칸·정답·정답보기에서 풀린다. */
.imgcard.dark .dexpic{filter:brightness(0)}
.imgcard .dexpic{transition:filter .45s ease-out}
.imgcard.correct.wasdark .dexpic{animation:dexreveal .45s ease-out}
@keyframes dexreveal{0%{filter:brightness(0)}100%{filter:none}}
/* 오답 갸웃 */
.imgcard.tilt .dexpic{animation:tilt .3s ease-in-out}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-4deg)}70%{transform:rotate(4deg)}}
/* 도감 카드 슬라이드업 */
.dexcard{position:absolute;left:0;right:0;bottom:0;z-index:5;border-radius:22px;background:#fff;
  box-shadow:0 -8px 30px rgba(40,90,150,.24);padding:12px 16px 10px;transform:translateY(105%);
  transition:transform .34s cubic-bezier(.2,.9,.3,1)}
.dexcard.up{transform:translateY(0)}
.dexcard .no{font-size:12px;font-weight:700;color:var(--muted)}
.dexcard .nm{font-family:var(--f-disp);font-size:26px;color:var(--primary-d);line-height:1.15}
.dexcard .chips{display:flex;gap:5px;margin:6px 0 7px;flex-wrap:wrap}
.dexcard .info{font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.5}
.btn-next{width:100%;min-height:52px;margin-top:9px;border-radius:16px;background:var(--primary);color:#fff;
  font-family:var(--f-disp);font-size:19px;box-shadow:0 6px 16px rgba(47,111,192,.3)}
.btn-next.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}

/* ══════════════ 결과 ══════════════ */
.result-card{background:var(--card);border-radius:24px;padding:24px 20px;text-align:center;box-shadow:var(--shadow)}
.result-face{font-size:46px;line-height:1}
.result-msg{font-family:var(--f-disp);font-size:19px;margin:6px 0 10px}
.score-row{display:flex;gap:10px;margin-top:6px}
.score-box{flex:1;background:#f2f7fd;border-radius:18px;padding:12px 6px}
.score-box .n{font-family:var(--f-disp);font-size:30px;color:var(--primary-d);line-height:1.1}
.score-box .l{font-size:12px;font-weight:700;color:var(--muted);margin-top:2px}
.miss-list{display:flex;flex-direction:column;gap:8px}
.miss-item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:8px 14px 8px 8px;
  box-shadow:var(--shadow-sm)}
.miss-item .th{width:56px;height:56px;flex:0 0 auto;border-radius:14px;background:#eaf3fd;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.miss-item .th img{width:100%;height:100%;object-fit:contain}
.miss-item .mn{font-family:var(--f-disp);font-size:19px}
.miss-item .mno{font-size:11.5px;font-weight:700;color:var(--muted)}
.result-btns{display:flex;flex-direction:column;gap:9px;margin:18px 0 8px}
.result-btns button{width:100%;min-height:58px;border-radius:18px;font-family:var(--f-disp);font-size:18px}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(47,111,192,.3)}
.btn-warm{background:linear-gradient(135deg,#ff8b7d,var(--ball-d));color:#fff;box-shadow:0 6px 16px rgba(214,60,52,.28)}
.btn-outline{background:#fff;color:var(--muted);box-shadow:inset 0 0 0 2px var(--line)}

/* 큰 화면(태블릿·데스크톱) — 그림과 키를 키워 빈 공간을 없앤다 */
@media (min-width:600px){
  .jamopad button{height:52px;font-size:22px}
  .tile{height:80px;font-size:38px}
  .slot{width:38px;height:38px;font-size:22px}
}
@media (min-height:820px){
  :root{--imgh:min(44vh,460px)}
  body.padopen{--imgh:min(40vh,420px)}
}

/* 아주 낮은 화면(iPhone SE 1세대 320×568 등) — 무엇도 잘리지 않게 한 단계 줄인다 */
@media (max-height:620px){
  .qhead{height:34px}
  .icon-btn{width:34px;height:34px;font-size:16px}
  .facts .f1{font-size:12px}
  .facts .f2{font-size:11.5px}
  .slot{width:26px;height:26px;font-size:16px}
  .msg{font-size:13px;line-height:18px;min-height:18px}
  .imgcard{min-height:120px}
  .jamopad button{height:34px;font-size:18px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
}
/* ── 통합에서 더한 것 ────────────────────────────────────────────── */
/* 근접 완충: 맞은 음절은 초록 확정, 처음 틀린 칸 하나만 흔든다(벌점 없음) */
.slot.ok{background:#e4f7ec;box-shadow:inset 0 0 0 3px var(--green);color:var(--green-d)}
/* 글자가 이름보다 많을 때. 빨강을 쓰지 않는다 — 오답 연출에 빨간색 금지 규칙과 같은 이유 */
.slot.over{background:#fff6dc;box-shadow:inset 0 0 0 3px var(--gold);color:var(--gold-d)}
.slot.shake{animation:shakeone .32s ease-in-out}
@keyframes shakeone{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.msg .okc{color:var(--green-d)}
.msg .badc{color:var(--ball-d)}
.msg b{font-weight:400;color:var(--ball-d)}

/* 스캔 2칸을 다 쓴 뒤에만 나타난다. 자동으로 뿌리지 않는다. */
.btn-reveal{flex:0 0 auto;align-self:center;padding:7px 18px;min-height:38px;border-radius:14px;
  background:#fff;box-shadow:inset 0 0 0 2px var(--line);font-family:var(--f-disp);font-size:14px;color:var(--muted)}
.btn-reveal[hidden]{display:none}
body.revealed .btn-reveal{display:none}
.answerbar button:disabled,.special-btn:disabled{opacity:.42}
.btn-start:disabled{opacity:.5}

/* 다른 종 이름을 쳤을 때 0.8초 응수 */
.otherpop{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;background:rgba(255,255,255,.93);opacity:0;pointer-events:none;transition:opacity .16s}
.otherpop.show{opacity:1}
.otherpop img{width:52%;max-height:58%;object-fit:contain}
.otherpop span{font-family:var(--f-disp);font-size:17px;color:var(--ink)}

/* 타일이 4개를 넘으면 줄바꿈한다(이름 6글자 → 타일 8개) */
.tilepad{flex-wrap:wrap;justify-content:center}
.tile{flex:1 1 26%;min-width:58px}
.tile.fn{flex:0 0 58px;font-size:22px;color:var(--muted);background:#e9f1f9;box-shadow:var(--shadow-sm)}
/* oskbd 는 OS 키보드를 쓰므로 접기 버튼이 필요 없다 */
body.oskbd .btn-fold{display:none}

/* [정답 보기] 가 나타나면 stage 에 한 줄이 더 생긴다. 껍데기 예산은 남는 여백이 0이라
   그만큼을 그림에서 떼어 온다 — 스캔 줄이 답 표시줄 뒤로 밀려 들어가면 안 된다.
   (측정: 360x667 키패드 펼침 · 4글자 이름 · 정보 2줄 · 스캔 2줄 기준) */
.imgcard{min-height:124px}
/* 360x667 처럼 세로가 빠듯한 폰: 스캔 두 줄 + [정답 보기] + 문장줄이 동시에 있는
   가장 깊은 힌트 상태에서만 그림이 이만큼까지 줄어든다(평소엔 200px 그대로다). */
@media (max-height:700px) and (min-height:621px){
  .slot{width:28px;height:28px;font-size:17px}
  .btn-reveal{min-height:34px}
  .imgcard{min-height:110px}
}
@media (max-height:620px){
  .imgcard{min-height:100px}
  .jamopad button{height:31px;font-size:17px}
  .btn-reveal{min-height:30px;font-size:13px;padding:5px 14px}
  /* 6글자 이름은 타일이 3줄(230px)까지 커져 스캔 줄과 [정답 보기] 를 통째로 밀어냈다 */
  .tile{height:50px;font-size:26px}
  .tilepad{padding:4px 2px;gap:6px}
  .tile.fn{flex:0 0 52px;font-size:19px}
  .slot{width:24px;height:24px;font-size:15px}
  .scans.n1,.scans.n2{min-height:32px}   /* 두 줄은 예산이 없다 — 한 줄만 보이고 스크롤된다 */
  .jamopad .k-fn{font-size:11.5px;white-space:nowrap}   /* 320px 폭에서 '된소리' 가 두 줄로 접히지 않게 */
}
/* 320px 폭에서는 표시창이 116px 밖에 안 돼 안내 문구가 글자 중간에서 잘린다.
   아이가 실제로 치는 글자(24px)는 그대로 두고 안내 문구만 줄인다. */
@media (max-width:340px){
  .display input::placeholder{font-size:15px}
  /* 320px 폭에서 '← 홈으로' 와 제목이 각각 두 줄로 접힌다 */
  .home{white-space:nowrap;padding:9px 10px;font-size:13px}
  #scrHome .title{font-size:15px}
  /* '전체 선택 · 전체 해제 · 이 범위에 386마리' 는 320px 한 줄에 안 들어간다(343 > 296) */
  .row-2{flex-wrap:wrap}
  .count-badge{margin-left:0;flex:1 1 100%;text-align:center}
}

<body>

<div class="app">

  <!-- ══════════ HOME ══════════ -->

      <span class="title">몬스터 도감 퀴즈</span>
      <span class="rec-chip">📕 <span id="metCount">0</span></span>
    </div>

    <div class="hero">
      <div class="mascot"></div>
      <h1>몬스터 도감 퀴즈</h1>

    </div>

    <button class="btn-start" id="btnStart"><span id="startMain">바로 시작</span><span class="sub" id="startSub"></span></button>

    <details class="fold" id="foldRange">
      <summary>범위 고르기 <span class="caret">▼</span></summary>
      <div class="fold-body">

        <div class="sub-h">세대</div>
        <div class="gen-grid" id="genGrid">
          <button class="gen-chip on" data-g="1">1세대</button>
          <button class="gen-chip on" data-g="2">2세대</button>
          <button class="gen-chip on" data-g="3">3세대</button>
          <button class="gen-chip" data-g="4">4세대</button>
          <button class="gen-chip" data-g="5">5세대</button>
          <button class="gen-chip" data-g="6">6세대</button>
          <button class="gen-chip" data-g="7">7세대</button>
          <button class="gen-chip" data-g="8">8세대</button>
          <button class="gen-chip" data-g="9">9세대</button>
        </div>
        <div class="row-2">
          <button class="mini-btn" id="btnAll">전체 선택</button>
          <button class="mini-btn" id="btnNone">전체 해제</button>
          <span class="count-badge" id="rangeCount">이 범위에 386마리</span>
        </div>

        <div class="sub-h">글자 입력 방법</div>
        <div class="opt-list" id="inputOpts">
          <label class="opt"><input type="radio" name="inp" value="oskbd"><span class="dot"></span>
            <span class="tx"><span class="nm">잘 친다</span>
            <span class="ds">휴대폰·컴퓨터 키보드로 직접 쳐요</span></span></label>
          <label class="opt on"><input type="radio" name="inp" value="keypad" checked><span class="dot"></span>
            <span class="tx"><span class="nm">느린 편이다</span>
            <span class="ds">앱 안에 있는 큰 자음·모음 키패드를 써요</span></span></label>
          <label class="opt"><input type="radio" name="inp" value="tile"><span class="dot"></span>
            <span class="tx"><span class="nm">아직 어렵다</span>
            <span class="ds">글자 타일을 순서대로 골라요. 글자를 미리 보여줘서 초성 힌트는 덜 쓸모 있어져요.</span></span></label>
        </div>

        <div class="sub-h">특별한 범위</div>
        <div class="special-row">
          <button class="special-btn" id="btnWrongOnly">아까 틀린 친구만<span class="cnt">7마리</span></button>
          <button class="special-btn" id="btnUnmet">아직 못 만난 친구<span class="cnt">258마리</span></button>
        </div>

        <div class="sub-h">소리</div>
        <div class="special-row">
          <button class="special-btn on" id="btnSfx">🔊 효과음 켜짐<span class="cnt">눌러서 끄기</span></button>
        </div>
      </div>
    </details>

    <div class="record-line" id="recLine"></div>
    <p class="credit">Pokémon © Nintendo · Creatures · GAME FREAK<br>데이터 PokeAPI · 비영리 학습용 팬 메이드</p>
  </div>

  <!-- ══════════ QUIZ ══════════ -->
  <div class="screen" id="scrQuiz">
    <div class="qhead">
      <button class="icon-btn" id="btnQuizHome" aria-label="홈으로">🏠</button>
      <div class="balls" id="balls"></div>
      <div class="qcount" id="qcount">3/10</div>
    </div>

    <div class="stage">
      <div class="imgcard" id="imgcard">
        <img class="dexpic" id="dexpic" alt="" draggable="false">
        <div class="overlay" id="typeChips"></div>
        <div class="gen-badge" id="genBadge"></div>
        <div class="otherpop" id="otherpop"><img alt="" draggable="false"><span></span></div>
      </div>

      <div class="facts" id="facts"></div>

      <div class="slots" id="slots"></div>

      <div class="msg" id="msg"></div>
      <button class="btn-reveal" id="btnReveal" hidden>정답 보기</button>

      <div class="scans" id="scans"></div>

      <!-- 정답 시 아래에서 올라오는 도감 카드 -->
      <div class="dexcard" id="dexcard">
        <div class="no" id="dexNo"></div>
        <div class="nm" id="dexName"></div>

        <div class="info" id="dexInfo"></div>

    <div class="answerbar">
      <div class="display" id="display">
        <input id="ansInput" type="text" placeholder="이름을 써봐" autocomplete="off"
               autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>
      <button class="btn-ok" id="btnOk">확인</button>
      <button class="btn-scan" id="btnScan" aria-label="도감 스캔"><span class="ic">💡</span><span class="lb">스캔</span></button>
      <button class="btn-fold" id="btnPadFold" aria-label="키패드 접기"><span class="ic">▾</span><span class="lb">자판</span></button>
    </div>

    <div class="jamopad" id="jamopad"></div>

    <div class="tilepad" id="tilepad"></div>
  </div>

  <!-- ══════════ RESULT ══════════ -->
  <div class="screen" id="scrResult">
    <div class="topbar">
      <a class="home" href="index.html">← 홈으로</a>
      <span class="title">한 판 끝!</span>
      <span class="rec-chip">📕 <span id="resMetCount">0</span></span>

        <div class="score-box"><div class="n" id="resOk"></div><div class="l">맞은 포켓몬</div></div>
        <div class="score-box"><div class="n" id="resScan"></div><div class="l">쓴 도감 스캔</div></div>

      <button class="btn-warm" id="btnRetryWrong" hidden>틀린 것만 다시</button>

      <button class="btn-outline" id="btnHome">홈</button>

</div>
